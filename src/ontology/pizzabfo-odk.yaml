# ODK configuration for Pizza BFO Ontology, written by OntoBoard for ODK v1.6.1.
# After changing it, run OntoBoard > Project > Update project files... (ODK: sh run.sh update_repo).
id: pizzabfo
title: "Pizza BFO Ontology"
description: "A pizza ontology aligned to BFO 2020 - the BFO that NFDIcore 3.0.5 builds on - and made from BFO and NFDIcore design patterns. It holds no individuals: its instance data is a separate knowledge graph built from ROBOT templates."
uribase: https://ebrahimnorouzi.github.io/pizza-bfo
license: https://creativecommons.org/licenses/by/4.0/
repo: pizzabfo
release_artefacts:
  - full
primary_release: full
export_formats:
  - owl
import_group:
  products:
    - id: bfo
      mirror_from: http://purl.obolibrary.org/obo/bfo/2020/bfo.owl
      module_type: slme
      module_type_slme: BOT
robot_report:
  use_labels: TRUE
  fail_on: ERROR
  custom_profile: TRUE
  report_on:
    - edit
